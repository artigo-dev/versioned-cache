# The environments the production-readiness harness needs, one profile per
# hazard. Nothing here is built: they are stock images with flags.
#
#   docker compose -f compose.tests.yaml --profile lru-allkeys up -d
#   REDIS_DSN=redis://127.0.0.1:6381 vendor/bin/phpunit --group eviction
#
# Ports are fixed per profile so several can run at once, and so a test can
# name the one it means. See docs/plans/production-readiness-harness.md.

x-evict: &evict
    image: redis:8-alpine
    # small enough that a few thousand items reach the ceiling in seconds
    healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 1s
        timeout: 3s
        retries: 30

services:
    # today's suite, unchanged
    redis:
        <<: *evict
        profiles: ["baseline"]
        command: redis-server --maxmemory-policy volatile-ttl --save ""
        ports: ["6390:6379"]

    # the floor: HSETEX is 8.0
    redis80:
        <<: *evict
        image: redis:8.0-alpine
        profiles: ["redis80"]
        command: redis-server --maxmemory-policy volatile-ttl --save ""
        ports: ["6391:6379"]

    # the policy the README claims is safe here and Symfony rejects
    redis-allkeys-lru:
        <<: *evict
        profiles: ["lru-allkeys", "eviction"]
        command: redis-server --maxmemory 32mb --maxmemory-policy allkeys-lru --save ""
        ports: ["6392:6379"]

    # the policy we expect to recommend instead
    redis-volatile-lru:
        <<: *evict
        profiles: ["lru-volatile", "eviction"]
        command: redis-server --maxmemory 32mb --maxmemory-policy volatile-lru --save ""
        ports: ["6393:6379"]

    # the adversarial case: no hot-key argument survives random
    redis-allkeys-random:
        <<: *evict
        profiles: ["random", "eviction"]
        command: redis-server --maxmemory 32mb --maxmemory-policy allkeys-random --save ""
        ports: ["6394:6379"]

    # a full memory ceiling with no way out: writes must degrade, never corrupt
    redis-noeviction:
        <<: *evict
        profiles: ["noeviction", "eviction"]
        command: redis-server --maxmemory 32mb --maxmemory-policy noeviction --save ""
        ports: ["6395:6379"]

    # latency, drops and timeouts against a real server rather than a double
    toxiproxy:
        image: ghcr.io/shopify/toxiproxy:2.11.0
        profiles: ["flaky"]
        ports: ["8474:8474", "6397:6397"]
        depends_on:
            redis-behind-proxy:
                condition: service_healthy

    redis-behind-proxy:
        <<: *evict
        profiles: ["flaky"]
        command: redis-server --maxmemory-policy volatile-ttl --save ""

    # three masters with a replica each, for failover=slaves: reads go to the
    # replicas, writes and scripts to the masters. Every node runs in this one
    # container and announces 127.0.0.1, so the addresses the cluster hands
    # out are the ones the host reaches.
    #   docker compose -f compose.tests.yaml --profile cluster-replicas up -d --wait
    #   REDIS_DSN="redis:?host[127.0.0.1:7110]&host[127.0.0.1:7111]&host[127.0.0.1:7112]&redis_cluster=1&failover=slaves"
    redis-cluster-replicas:
        image: redis:8-alpine
        profiles: ["cluster-replicas"]
        ports: ["7110-7115:7110-7115"]
        # healthy once the slot map names every replica and each has synced:
        # before that a read sent to a replica times out, and the adapter
        # serves misses - correct, but not what the tests are there to see
        healthcheck:
            test: ["CMD-SHELL", "[ $$(redis-cli -p 7110 cluster slots | grep -cE '^711[345]$$') -ge 3 ] && for p in 7110 7111 7112 7113 7114 7115; do redis-cli -p $$p cluster info | grep -q cluster_state:ok || exit 1; done && for p in 7113 7114 7115; do redis-cli -p $$p info replication | grep -q master_link_status:up || exit 1; done"]
            interval: 1s
            timeout: 3s
            retries: 60
        command: >
            sh -c 'for port in 7110 7111 7112 7113 7114 7115; do
            redis-server --port $$port --cluster-enabled yes --cluster-config-file nodes-$$port.conf
            --cluster-announce-ip 127.0.0.1 --maxmemory-policy volatile-ttl --save "" --daemonize yes;
            done;
            until redis-cli -p 7115 ping; do sleep 0.2; done;
            redis-cli --cluster create 127.0.0.1:7110 127.0.0.1:7111 127.0.0.1:7112
            127.0.0.1:7113 127.0.0.1:7114 127.0.0.1:7115 --cluster-replicas 1 --cluster-yes;
            tail -f /dev/null'

    # kill the primary mid-write and watch what the adapter does
    redis-primary:
        <<: *evict
        profiles: ["failover"]
        command: redis-server --maxmemory-policy volatile-ttl --save ""
        ports: ["6396:6379"]

    redis-replica:
        <<: *evict
        profiles: ["failover"]
        command: redis-server --replicaof redis-primary 6379 --save ""
        depends_on:
            redis-primary:
                condition: service_healthy

    sentinel:
        image: redis:8-alpine
        profiles: ["failover"]
        ports: ["26390:26379"]
        depends_on:
            redis-replica:
                condition: service_started
        command: >
            sh -c 'printf "%s\n"
            "port 26379"
            "sentinel resolve-hostnames yes"
            "sentinel monitor mymaster redis-primary 6379 1"
            "sentinel down-after-milliseconds mymaster 1000"
            "sentinel failover-timeout mymaster 5000"
            > /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf'
